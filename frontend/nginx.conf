server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API routing modes (activate only one block if you need nginx to proxy /api):
  #
  # Default (recommended for this repo):
  # - Keep both blocks below commented.
  # - Docker Compose/local uses VITE_API_BASE_URL from frontend build.
  # - Kubernetes uses ingress path routing (/api -> backend service).
  #
  # Option A: Docker Compose internal proxy
  # location /api/ {
  #   proxy_pass http://backend:8000/api/;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
  #
  # Option B: Kubernetes service DNS proxy
  # location /api/ {
  #   proxy_pass http://datascience-lab-backend.data-visualization-tool.svc.cluster.local:8000/api/;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
