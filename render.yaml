services:
  - type: web
    name: datascience-lab-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        value: https://datascience-lab-web.onrender.com,http://localhost:5173
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"

  - type: web
    name: datascience-lab-web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://datascience-lab-api.onrender.com/api
