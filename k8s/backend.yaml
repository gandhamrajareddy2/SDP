apiVersion: apps/v1
kind: Deployment
metadata:
  name: datascience-lab-backend
  namespace: data-visualization-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datascience-lab-backend
  template:
    metadata:
      labels:
        app: datascience-lab-backend
    spec:
      containers:
        - name: backend
          image: datascience-lab-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CORS_ALLOW_ORIGINS
              value: "http://localhost:5173,http://127.0.0.1:5173,http://datascience-lab.local"
            - name: CORS_ALLOW_CREDENTIALS
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: datascience-lab-backend
  namespace: data-visualization-tool
spec:
  selector:
    app: datascience-lab-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
